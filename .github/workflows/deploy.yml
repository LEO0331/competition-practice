name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Validate and test
        run: |
          npm run validate:data
          npm run lint
          npm run typecheck
          npm test
      - name: Build static site
        run: npm run build
        env:
          # Pages metadata can retain the previous path after a repository rename.
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - name: Verify exported asset paths
        run: node scripts/check-export.mjs
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
