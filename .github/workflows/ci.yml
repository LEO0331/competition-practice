name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate and test
        run: |
          npm run validate:data
          npm run lint
          npm run typecheck
          npm test
      - name: Build with repository path
        run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - name: Verify exported asset paths
        run: node scripts/check-export.mjs
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
