name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate and test
        run: |
          npm run validate:data
          npm run lint
          npm run typecheck
          npm test
      - name: Build with repository path
        run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
